name: sonya_birthday
description: "Пиксельная вечериночная игра «С днем рождения, Соня» для Google TV."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.10.0
  audioplayers: ^6.5.1
  material_ui: ^1.11.0
  path_provider: ^2.1.6
  shelf: ^1.4.3
  shelf_router: ^1.1.5
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/levels/demo.json
    - assets/images/
    - assets/video/
    - assets/audio/
    - assets/audio/voice/

  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
